name: SignalCheck daily

on:
  schedule:
    - cron: '17 14 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signalcheck-daily
  cancel-in-progress: false

env:
  # Keep '.' when this package is at the audit repository root.
  QA_PACKAGE_DIR: '.'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Require a private audit repository
        env:
          REPO_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPO_PRIVATE" != 'true' ]; then
            echo 'Copy this template and package into a private audit repository so evidence stays private.'
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser runner
        run: |
          cd "$QA_PACKAGE_DIR/skills/signalcheck/scripts/browser-qa"
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Restore previous completed report
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.QA_PACKAGE_DIR }}/reports/history
          key: signalcheck-history-${{ github.run_id }}
          restore-keys: signalcheck-history-
      - name: Load configured site profile
        env:
          PROFILE_JSON: ${{ secrets.WEBSITE_QA_PROFILE_JSON }}
        run: |
          cd "$QA_PACKAGE_DIR"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const text = process.env.PROFILE_JSON;
          if (!text) throw new Error('Set WEBSITE_QA_PROFILE_JSON to a reviewed site profile before running.');
          try { JSON.parse(text); }
          catch { throw new Error('WEBSITE_QA_PROFILE_JSON must contain valid JSON; content omitted.'); }
          fs.mkdirSync('reports', {recursive:true});
          fs.writeFileSync('reports/profile.json', text, {mode:0o600});
          JS
      - name: Run read-only browser audit
        id: scan
        continue-on-error: true
        run: |
          cd "$QA_PACKAGE_DIR"
          if [ -f reports/history/report.json ]; then
            node skills/signalcheck/scripts/browser-qa/bin/run.mjs --config reports/profile.json --output reports/current --previous reports/history/report.json
          else
            node skills/signalcheck/scripts/browser-qa/bin/run.mjs --config reports/profile.json --output reports/current
          fi
      - name: Generate report and preserve valid history
        if: always()
        run: |
          cd "$QA_PACKAGE_DIR"
          if [ ! -f reports/current/report.json ]; then
            echo 'No report produced; monitoring is unverified.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          node skills/signalcheck/scripts/browser-qa/bin/report.mjs reports/current/report.json
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const r=JSON.parse(fs.readFileSync('reports/current/report.json','utf8'));
          if(r.executionComplete===true){
            fs.mkdirSync('reports/history',{recursive:true});
            fs.copyFileSync('reports/current/report.json','reports/history/report.json');
          }
          JS
      - name: Save comparison history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ env.QA_PACKAGE_DIR }}/reports/history
          key: signalcheck-history-${{ github.run_id }}
      - name: Retain private evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signalcheck-${{ github.run_id }}
          path: ${{ env.QA_PACKAGE_DIR }}/reports/current/
          retention-days: 7
          if-no-files-found: error
      - name: Check completion and findings
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: |
          cd "$QA_PACKAGE_DIR"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          if(!fs.existsSync('reports/current/report.json')) process.exit(1);
          const r=JSON.parse(fs.readFileSync('reports/current/report.json','utf8'));
          if(r.executionComplete!==true || r.status==='failed') process.exit(1);
          if(process.env.SCAN_OUTCOME!=='success') process.exit(1);
          console.log('Inspect report coverage and remaining warnings; job completion does not verify untested journeys.');
          JS
